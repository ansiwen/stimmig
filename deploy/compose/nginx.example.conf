# nginx in front of Stimmig started with compose.proxy.yaml (setup.sh
# --behind-proxy). Replace example.org with your domain and the certificate
# paths with yours; one certificate for the three names, or one each. On a
# host without IPv6, remove the [::] listen lines.
#
# The ballot box must not record client addresses (SPEC.md section 10): its
# server has no access log, and its error log goes nowhere, because nginx
# names the client in every error line. The other two may log as you like.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vote.example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    access_log off;
    error_log /dev/null;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        # No X-Forwarded-For or X-Real-IP: the ballot box has no use for the
        # client address and must not get it.
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name registrar.example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name log.example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# Plain HTTP only redirects: the voting page must never be served over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name vote.example.org registrar.example.org log.example.org;
    access_log off;
    return 301 https://$host$request_uri;
}
