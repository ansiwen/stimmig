{{- range $role, $cfg := .Values.roles }}
{{- if $cfg.enabled }}
{{- $name := printf "%s-%s" $.Release.Name $role }}
{{- $labels := dict "release" $.Release.Name "role" $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "stimmig.labels" $labels | nindent 4 }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stimmig.labels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stimmig.labels" $labels | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stimmig
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $role | quote }}]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ required (printf "roles.%s.existingSecret is required" $role) $cfg.existingSecret }}
          env:
            - name: STIMMIG_LISTEN
              value: ":8080"
            {{- if ne $role "log" }}
            - name: STIMMIG_LOG_URL
              value: {{ $.Values.logURL | default (printf "http://%s-log" $.Release.Name) | quote }}
            {{- end }}
            {{- range $key, $value := $cfg.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "stimmig.labels" $labels | nindent 4 }}
spec:
  selector:
    {{- include "stimmig.labels" $labels | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "stimmig.labels" $labels | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $cfg.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "stimmig.labels" $labels | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with index $.Values.ingress.tlsSecrets $role }}
  tls:
    - hosts: [{{ $cfg.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $cfg.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
