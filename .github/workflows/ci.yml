name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stimmig
          POSTGRES_PASSWORD: stimmig
          POSTGRES_DB: stimmig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STIMMIG_TEST_DATABASE_URL: postgres://stimmig:stimmig@localhost/stimmig_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./tally -run '^$' -fuzz FuzzTally -fuzztime 30s
      - run: go test ./canon -run '^$' -fuzz FuzzCheck -fuzztime 30s
      - run: go test ./publog -run '^$' -fuzz FuzzVerify -fuzztime 30s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
