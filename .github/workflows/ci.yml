name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stimmig
          POSTGRES_PASSWORD: stimmig
          POSTGRES_DB: stimmig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STIMMIG_TEST_DATABASE_URL: postgres://stimmig:stimmig@localhost/stimmig_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=js GOARCH=wasm go vet ./web/wasm
      - run: make web
      - run: helm lint deploy/helm/stimmig
      - run: go test ./tally -run '^$' -fuzz FuzzTally -fuzztime 300000x
      - run: go test ./canon -run '^$' -fuzz FuzzCheck -fuzztime 300000x
      - run: go test ./publog -run '^$' -fuzz FuzzVerify -fuzztime 300000x

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stimmig
          POSTGRES_PASSWORD: stimmig
          POSTGRES_DB: stimmig
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Create the databases
        run: |
          for d in log reg box; do
            PGPASSWORD=stimmig psql -h localhost -U stimmig -d stimmig -c "CREATE DATABASE stimmig_$d"
          done
      - name: Run the voting client in the browser through an election
        env:
          STIMMIG_DB_URL_PREFIX: postgres://stimmig:stimmig@localhost
        run: web/check/run.sh

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ProVerif
        run: sudo apt-get update && sudo apt-get install -y proverif
      - name: Check the protocol model
        run: model/run.sh
