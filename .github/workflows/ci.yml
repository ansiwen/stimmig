name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: stimmig
          POSTGRES_PASSWORD: stimmig
          POSTGRES_DB: stimmig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STIMMIG_TEST_DATABASE_URL: postgres://stimmig:stimmig@localhost/stimmig_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=js GOARCH=wasm go vet ./web/wasm
      - run: make web
      - run: helm lint deploy/helm/stimmig
      - run: go test ./tally -run '^$' -fuzz FuzzTally -fuzztime 300000x
      - run: go test ./canon -run '^$' -fuzz FuzzCheck -fuzztime 300000x
      - run: go test ./publog -run '^$' -fuzz FuzzVerify -fuzztime 300000x

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: stimmig
          POSTGRES_PASSWORD: stimmig
          POSTGRES_DB: stimmig
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Create the databases
        run: |
          for d in log reg box; do
            PGPASSWORD=stimmig psql -h localhost -U stimmig -d stimmig -c "CREATE DATABASE stimmig_$d"
          done
      - name: Run the voting client in the browser through an election
        env:
          STIMMIG_DB_URL_PREFIX: postgres://stimmig:stimmig@localhost
        run: web/check/run.sh

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu has no ProVerif package, so build the release and check its hash.
      # The package ocaml has the native compiler (ocaml-nox is gone in 26.04);
      # ProVerif 2.05 builds with OCaml 4.14 to 5.4.
      - name: Build ProVerif 2.05
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml
          curl -sSfL -o "$RUNNER_TEMP/pv.tgz" https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  $RUNNER_TEMP/pv.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/pv.tgz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/proverif2.05" && ./build -nointeract)
      - name: Check the protocol model
        run: PROVERIF="$RUNNER_TEMP/proverif2.05/proverif" model/run.sh

  pyverify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The independent verifier, written from SPEC.md alone, on the golden export.
      # A virtual environment: the runner's Python refuses packages installed
      # system-wide (PEP 668).
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install cryptography==50.0.1
      - run: '"$RUNNER_TEMP/venv/bin/python" pyverify/verify.py election/testdata/election-v1.cbor'
